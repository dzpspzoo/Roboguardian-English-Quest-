<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asystent AEGIS-7 – podgląd</title>
<style>
  body{margin:0;background:#0b1830;color:#e8f1ff;font-family:system-ui,sans-serif;padding:16px}
  .bar{max-width:860px;margin:0 auto 1rem;background:#13233d;border-radius:12px;padding:.8rem 1rem}
  .bar p{margin:.2rem 0 .6rem;opacity:.8}
  .bar button{font:inherit;min-height:44px;padding:.5rem .9rem;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;color:inherit;cursor:pointer;margin:.2rem}
  .bar button.on{background:#3fb6ff;color:#04121f;border-color:#3fb6ff}
  pre{max-width:860px;margin:1rem auto;background:#13233d;padding:.8rem;border-radius:10px;white-space:pre-wrap;font-size:.85rem}
</style>
</head>
<body>
<div class="bar">
  <b>Podgląd asystenta AEGIS-7</b>
  <p>Symulacja 2 tygodni gry wymyślonego dziecka (dane przykładowe, nie prawdziwe). Wybierz typ dziecka:</p>
  <button data-kind="hishher" class="on">Myli his/her, zgaduje</button>
  <button data-kind="ear">Słabe słuchanie (ship/sheep)</button>
  <button data-kind="tired">Męczy się w długich sesjach</button>
  <button data-kind="good">Idzie dobrze</button>
</div>
<div id="panel"></div>
<pre id="settings"></pre>
<script type="module">
import RGAssistant from './assistant.js';
import { renderParentPanel } from './panel.js';

const DAY = 86400000, MIN = 60000;
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const VOCAB = ['jacket','dress','hat','boots','scarf','gloves','shirt','skirt','socks','shoes','cold','hot','sunny','rainy','cloudy','windy','monday','tuesday','art','music','maths','geography'];

function simulate(kind) {
  const p = {}; const r = rng(42);
  const start = Date.now() - 14 * DAY;
  const days = kind === 'good' ? [0,1,2,3,5,6,7,8,9,11,12,13] : [0,1,3,4,7,8,10,11,13];
  if (kind === 'ear') p.calibration = { schema: 'roboguardian.calibration/1', finishedAt: start - DAY, context: { age: 9 },
    sections: { words: { n: 20, correct: 15, score: .75 }, listening: { n: 12, correct: 6, score: .5 }, spelling: { n: 10, correct: 6, score: .6 } },
    contrasts: { i_ee: { n: 4, correct: 1 }, ae_e: { n: 4, correct: 2 }, th_s_f: { n: 4, correct: 2 } },
    profile: { overall: 'A1-', weaknesses: ['listening'], weakContrasts: ['i_ee', 'ae_e'] }, plan: { supports: { slowAudioDefault: true } } };
  days.forEach((d, di) => {
    let t = start + d * DAY + 16 * 60 * MIN;
    const session = 's' + d;
    const n = kind === 'tired' ? 45 : 24;
    for (let i = 0; i < n; i++) {
      t += 35000 + r() * 20000;
      const lvl = RGAssistant.nextSettings(p, { skill: 'vocab', session, now: t }).level;
      const tiredPenalty = kind === 'tired' && i > 25 ? 0.35 : 0;
      const learn = Math.min(0.15, di * 0.015);
      // słówka
      const w = VOCAB[Math.floor(r() * VOCAB.length)];
      const pOk = Math.max(0.05, 1 / (1 + Math.exp(1.6 * (lvl - 3.4))) + learn - tiredPenalty + (kind === 'good' ? .1 : 0));
      const ok = r() < pOk;
      const fast = kind === 'hishher' && !ok && r() < .7;
      RGAssistant.record(p, { t, session, mission: 'paliwo', item: w, skill: 'vocab', mode: r() < .5 ? 'listen' : 'read',
        ok, ms: fast ? 700 : 2000 + r() * 3000, hint: r() < .3, chosen: ok ? null : VOCAB[Math.floor(r() * VOCAB.length)] });
      if (i % 3 === 0) {
        if (kind === 'ear' || kind === 'good') {
          const pair = r() < .5 ? ['ship', 'sheep', 'ih'] : ['bed', 'bad', 'ae'];
          const k = r() < .5 ? 0 : 1;
          const okE = r() < (kind === 'good' ? .9 : .45 + learn);
          RGAssistant.record(p, { ts: t + 1000, missionId: 'ch1-ear', itemId: pair[k], skill: 'ear', target: pair[2], correct: okE, attempts: 1, ms: 2600, chosen: okE ? null : pair[1 - k] });
        } else {
          const k = r() < .5 ? 'his' : 'her';
          const okG = r() < (kind === 'tired' && i > 25 ? .4 : .5 + learn);
          RGAssistant.record(p, { t: t + 1000, session, mission: 'paliwo', item: k, skill: 'grammar.his_her', mode: 'choose', ok: okG, ms: okG ? 2500 : 800, chosen: okG ? null : (k === 'his' ? 'her' : 'his') });
        }
      }
    }
  });
  return p;
}

function show(kind) {
  document.querySelectorAll('[data-kind]').forEach(b => b.classList.toggle('on', b.dataset.kind === kind));
  const p = simulate(kind);
  renderParentPanel(document.getElementById('panel'), p, { name: 'Strażnik (przykład)' });
  const s = RGAssistant.nextSettings(p, { skill: 'vocab' });
  const d = RGAssistant.getDifficulty(p, kind === 'ear' ? 'ch1-ear' : 'paliwo');
  document.getElementById('settings').textContent =
    'Co gra ustawi w następnej misji (dla twórców gry):\n' + JSON.stringify({ nextSettings: s, getDifficulty: d }, null, 2);
}
document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => show(b.dataset.kind));
show('hishher');
</script>
</body>
</html>
